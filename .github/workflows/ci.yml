# 教育教学 Agent · GitHub Actions CI
# 契约依据：04-任务包/02-工程骨架与三处一致性校验.md §3 —— push / PR 时跑
#   .\gradlew contractCheck、.\gradlew test、.\gradlew assembleDebug，任一失败即红。
#
# 说明：本仓库当前**无远端**，本文件按任务包 §3 预先提交；接入远端后即生效。

name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: contractCheck + test + assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1) 契约资产 + 冻结版本目录 + 端侧常量三处一致性
      - name: contractCheck
        run: ./gradlew contractCheck --no-daemon --console=plain

      # 2) 全部模块单元测试
      - name: test
        run: ./gradlew test --no-daemon --console=plain

      # 3) :app debug 构建
      - name: assembleDebug
        run: ./gradlew assembleDebug --no-daemon --console=plain

      # 4) 静态检查（允许既定基线）
      - name: detekt
        run: ./gradlew detekt --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
